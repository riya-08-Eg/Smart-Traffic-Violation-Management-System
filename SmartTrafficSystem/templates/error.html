{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block title %}{{ title }} | TrafficSafe{% endblock %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
<div class="card narrow"><div class="empty-state" style="padding:60px 20px"><div style="font-size:56px;font-weight:800;color:var(--brand);line-height:1">{{ code }}</div><h4 style="margin-top:10px;font-size:18px">{{ title }}</h4><p style="max-width:420px;margin:6px auto 18px">{{ message }}</p><a class="btn btn-primary" href="{{ url_for('home') }}">{{ icon('grid') }} Back to dashboard</a></div></div>
{% endblock %}
